name: Robô de preços

on:
  schedule:
    - cron: "*/15 * * * *"   # acorda a cada 15 min; cada rota respeita o intervalo escolhido no app
  workflow_dispatch:
    inputs:
      force:
        description: "Verificar todas as rotas agora"
        type: boolean
        default: false

concurrency:
  group: robo
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # usado pelo keepalive para o GitHub não desligar o agendamento

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r bot/requirements.txt

      - name: Verificar preços
        working-directory: bot
        env:
          SUPABASE_URL: https://zukcutypxxpxbioxupss.supabase.co
          APP_URL: https://vitorwangg.github.io/radar-voos/
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: https://github.com/vitorwangg/radar-voos
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ${{ inputs.force && '--force' || '' }}

      # O GitHub pausa agendamentos de repositórios sem atividade por 60 dias; isto evita a pausa.
      - uses: liskin/gh-workflow-keepalive@v1
